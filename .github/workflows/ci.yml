name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 59.3.0
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble

jobs:
  backend-quality:
    name: Isolated backend quality gates
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Build production image for tests
        run: docker buildx build --builder default --load --tag p-040-backend:latest .
      - name: Run Ruff, Alembic and pytest with isolated ParadeDB
        run: |
          docker compose --project-name p040-ci-test --file docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from backend-test
      - name: Start production container for smoke test
        run: |
          docker run --detach --name p040-ci --publish 8000:8000 \
            --env APP_ENV=test p-040-backend:latest
      - name: Verify production container health endpoint
        run: |
          for _ in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs p040-ci
          exit 1
      - name: Show logs on failure
        if: failure()
        run: |
          docker logs p040-ci 2>/dev/null || true
          docker compose --project-name p040-ci-test --file docker-compose.test.yml logs --no-color
      - name: Clean up isolated containers and volumes
        if: always()
        run: |
          docker rm --force p040-ci 2>/dev/null || true
          docker compose --project-name p040-ci-test --file docker-compose.test.yml down \
            --volumes --remove-orphans

  frontend-quality:
    name: Frontend lint, unit tests, and production build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-e2e:
    name: Browser E2E with isolated ParadeDB
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Start isolated E2E backend
        run: |
          docker compose --project-name p040-ci-e2e --file docker-compose.e2e.yml up \
            --build --detach --wait
      - name: Run Playwright journeys in official image
        run: |
          docker run --rm --ipc=host \
            --add-host host.docker.internal:host-gateway \
            --volume "$PWD/frontend:/work/frontend" \
            --workdir /work/frontend \
            --env CI=true \
            --env API_UPSTREAM_URL=http://host.docker.internal:8001 \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc "npm ci && npm run test:e2e"
      - name: Show E2E logs on failure
        if: failure()
        run: docker compose --project-name p040-ci-e2e --file docker-compose.e2e.yml logs --no-color
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: frontend/test-results
          if-no-files-found: warn
          retention-days: 7
      - name: Clean up E2E containers and volumes
        if: always()
        run: |
          docker compose --project-name p040-ci-e2e --file docker-compose.e2e.yml down \
            --volumes --remove-orphans

  deploy-preview:
    name: Deploy Vercel Preview from develop
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: [backend-quality, frontend-quality, browser-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: vercel-preview
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      API_UPSTREAM_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pull Preview environment
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build Preview artifact
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt Preview
        id: deploy
        run: |
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Preview and API proxy
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # `vercel curl` reads VERCEL_TOKEN from the job environment. Its beta
          # wrapper forwards an explicit --token flag to the underlying curl.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" curl "$DEPLOYMENT_URL/" \
            -- --fail --silent --show-error --output /dev/null
          status="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" curl \
            "$DEPLOYMENT_URL/api/v1/auth/me" -- --silent --output /dev/null --write-out '%{http_code}')"
          test "$status" = "401"
