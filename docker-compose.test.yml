services:
  test-db:
    image: paradedb/paradedb:v0.23.4-pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pgonboarding_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # ParadeDB starts a temporary postmaster while installing extensions.
      # Wait for the final PID 1 postmaster, otherwise migrations can race the
      # bootstrap shutdown and fail with a transient connection refusal.
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 /var/lib/postgresql/data/postmaster.pid)" = "1" &&
          pg_isready -U app -d pgonboarding_test &&
          test "$$(psql -U app -d pgonboarding_test -tAc "SELECT 1 FROM pg_extension WHERE extname = 'pg_search'")" = "1"
      interval: 2s
      timeout: 5s
      retries: 20

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://app:app@test-db:5432/pgonboarding_test
    depends_on:
      test-db:
        condition: service_healthy
