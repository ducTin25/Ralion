name: ${COMPOSE_PROJECT_NAME:-p040}

services:
  db:
    image: paradedb/paradedb:v0.23.4-pg16
    # Preserve the preload set shipped by ParadeDB. Overriding it with only
    # pg_search makes the image's first-run pg_cron bootstrap fail.
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      # The image starts a temporary postmaster while installing extensions.
      # Require PID 1 plus pg_search so Compose cannot release migrations during
      # the handoff from that temporary server to the final postmaster.
      test:
        - CMD-SHELL
        - >-
          test "$$(head -n 1 /var/lib/postgresql/data/postmaster.pid)" = "1" &&
          pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB &&
          test "$$(psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc "SELECT 1 FROM pg_extension WHERE extname = 'pg_search'")" = "1"
      interval: 5s
      timeout: 5s
      retries: 20
      # Extension bootstrap is slower on a fresh e2-medium/standard disk.
      start_period: 60s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable GHCR digest}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/p040/env/backend.env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    profiles: ["tools"]
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable GHCR digest}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/p040/env/backend.env}
    volumes:
      - appdata:/app/data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - private
    logging: *default-logging

networks:
  private:
    driver: bridge

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
